<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Ferguson Zibiri, Weiyu Yin">
        <meta name="description" content="My first web page">
        <meta name="keywords" content="html, css, web, web development, javascript">
        <link rel="icon" href="./assets/media/icon.png" type="image/x-icon">
        <script src="./assets/scripts/app.js" type="module"></script>
        <link rel="stylesheet" href="./assets/styles/style.css">
        <title>Key Race</title>
    </head>
    <body>
        <div class="container">
            <div class="head">
                <p class="name">Key Race</p>
            </div>
            <div class="game">
                <div class="timer inner">
                    <p class="timer-txt">Ready To Race?</p>
                </div>
                <div class="tbw inner">
                    <p class="given">
                        
                    </p>
                </div>
                <div class="type inner">
                    <input type="text" placeholder="Type Here" class="input">
                </div>
                <div class="start inner">
                    <button class="startBtn">Start Game</button> 
                </div>  
            </div>
             <div class="scoreboard">
                    <h3 class="scoreboard-title">Top 9 Scores</h3>
                    <div class="score-list">
                        <p class="score-empty">No scores yet.<br>Start racing!</p>
                    </div>
                </div>
            <div class="overlay">
                <p class="countdown"></p>
            </div>
            <div class="overlay-2">
                <div class="score">
                    <div class="write-up">
                        <h2 class="over">iydgfbvihbkdf </h2>
                        <p class="score">gfbuvibdf</p>
                        <p class="score">jkbhfvuosbjdfk</p>
                    </div>
                    <button class="restart">Restart Game</button>
                </div>
            </div>
        </div>
    </body>
</html>
